[build-system]
requires = ["uv_build==0.12.19"]
build-backend = "uv_build"

[project]
name = "llm-weissman-index"
version = "0.1.0"
description = "Reproducible quality-adjusted efficiency metrics for language-model systems, inspired by the Weissman Score."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Weby Homelab" }]
keywords = ["llm", "benchmark", "inference", "efficiency", "latency", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["PyYAML>=6.0.2,<7"]

[project.scripts]
lwi = "llm_weissman.cli:main"

[dependency-groups]
dev = [
    "jsonschema>=4.25,<5",
    "pytest>=8.4,<10",
    "ruff>=0.12,<0.14",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.build-backend]
module-name = "llm_weissman"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]
exclude = ["dist", ".venv", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
source = ["llm_weissman"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
