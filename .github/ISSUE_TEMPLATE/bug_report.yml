name: Bug report
description: Report a reproducible implementation or validation defect.
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include a minimal non-sensitive input and exact command.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected versus observed
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
