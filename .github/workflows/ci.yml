name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      # actions/checkout v7.0.1; immutable commit pin.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # astral-sh/setup-uv v9.0.0; immutable commit pin.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.11.33"
          enable-cache: true
      - name: Install Python
        run: uv python install "${{ matrix.python-version }}"
      - name: Sync locked environment
        run: uv sync --locked --python "${{ matrix.python-version }}"
      - name: Check lockfile
        run: uv lock --check
      - name: Lint
        run: uv run --python "${{ matrix.python-version }}" ruff check .
      - name: Format check
        run: uv run --python "${{ matrix.python-version }}" ruff format --check .
      - name: Tests
        run: uv run --python "${{ matrix.python-version }}" pytest

  build:
    name: build distribution
    runs-on: ubuntu-latest
    needs: quality
    steps:
      # actions/checkout v7.0.1; immutable commit pin.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # astral-sh/setup-uv v9.0.0; immutable commit pin.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.11.33"
          enable-cache: true
      - name: Install Python
        run: uv python install 3.13
      - name: Sync locked environment
        run: uv sync --locked --python 3.13
      - name: Build without local sources
        run: uv build --no-sources
      - name: Inspect artifact names
        run: python scripts/inspect_artifacts.py
